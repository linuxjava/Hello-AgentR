<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello-AgentR · 新对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/lucide@0.468.0"></script>
</head>
<body>
  <div class="app">
    <div class="orb orb-violet"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-pink"></div>
    <div class="orb orb-blue"></div>

    <div class="shell">
      <aside class="sidebar glass">
        <div class="side-top">
          <div class="brand">
            <div class="logo">A</div>
            <div>
              <div class="brand-name">Hello-AgentR</div>
              <div class="brand-sub">智能对话</div>
            </div>
          </div>
          <a class="btn-new" href="index.html"><i data-lucide="plus"></i>开启新对话</a>
          <div class="hist-head">
            <span class="hist-title">最近对话</span>
            <i data-lucide="search"></i>
          </div>
          <div class="history">
            <a class="hist-item" href="chat.html">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">报销制度怎么申请？</div>
                <div class="hist-time">今天</div>
              </div>
            </a>
            <button class="hist-item" type="button">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">年假剩余天数查询</div>
                <div class="hist-time">今天</div>
              </div>
            </button>
            <button class="hist-item" type="button">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">合同审批流程说明</div>
                <div class="hist-time">昨天</div>
              </div>
            </button>
            <button class="hist-item" type="button">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">知识库切片策略建议</div>
                <div class="hist-time">昨天</div>
              </div>
            </button>
            <button class="hist-item" type="button">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">MCP 工具调用失败排查</div>
                <div class="hist-time">周一</div>
              </div>
            </button>
            <button class="hist-item" type="button">
              <i data-lucide="message-square"></i>
              <div class="hist-text">
                <div class="hist-name">意图树如何配置</div>
                <div class="hist-time">周一</div>
              </div>
            </button>
          </div>
        </div>
        <div class="user-card">
          <div class="avatar">我</div>
          <div>
            <div class="user-name">访客用户</div>
            <div class="user-role">免费版</div>
          </div>
          <i class="settings" data-lucide="settings"></i>
        </div>
      </aside>

      <main class="main glass">
        <header class="chat-header">
          <div class="chat-header-left">
            <h1 class="chat-title">新对话</h1>
            <span class="model-chip"><i data-lucide="sparkles"></i>AgentR · 深度思考</span>
          </div>
          <div class="chat-header-right">
            <button class="icon-btn" type="button" aria-label="分享"><i data-lucide="share"></i></button>
            <button class="icon-btn" type="button" aria-label="更多"><i data-lucide="ellipsis"></i></button>
          </div>
        </header>

        <div class="messages welcome">
          <div class="welcome-hero">
            <div class="welcome-av"><i data-lucide="sparkles"></i></div>
            <h2 class="welcome-hello">你好，我是 Hello-AgentR</h2>
            <p class="welcome-sub">企业级 Agentic RAG 助手 · 可检索知识库、调用工具、深度思考</p>
          </div>
          <div class="prompt-cards">
            <button class="prompt-card glass-strong" type="button" data-prompt="报销制度怎么申请？需要哪些材料？">
              <span class="prompt-icon"><i data-lucide="book-open"></i></span>
              <span class="prompt-title">知识库问答</span>
              <span class="prompt-desc">报销制度怎么申请？需要哪些材料？</span>
            </button>
            <button class="prompt-card glass-strong" type="button" data-prompt="合同审批要经过哪些节点？">
              <span class="prompt-icon"><i data-lucide="git-branch"></i></span>
              <span class="prompt-title">流程指引</span>
              <span class="prompt-desc">合同审批要经过哪些节点？</span>
            </button>
            <button class="prompt-card glass-strong" type="button" data-prompt="今年年假和调休有什么变化？">
              <span class="prompt-icon"><i data-lucide="search"></i></span>
              <span class="prompt-title">政策检索</span>
              <span class="prompt-desc">今年年假和调休有什么变化？</span>
            </button>
            <button class="prompt-card glass-strong" type="button" data-prompt="MCP 工具调用失败怎么排查？">
              <span class="prompt-icon"><i data-lucide="wrench"></i></span>
              <span class="prompt-title">排查助手</span>
              <span class="prompt-desc">MCP 工具调用失败怎么排查？</span>
            </button>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="composer glass-strong">
            <textarea id="chat-input" rows="1" placeholder="继续提问，Enter 发送…" aria-label="输入问题"></textarea>
            <div class="composer-row">
              <div class="composer-left">
                <button class="tool-btn" type="button" aria-label="附件"><i data-lucide="paperclip"></i></button>
                <button class="tool-btn" type="button" aria-label="图片"><i data-lucide="image"></i></button>
                <button class="tool-btn active" type="button" data-toggle-deep aria-label="深度思考" aria-pressed="true"><i data-lucide="brain"></i></button>
                <span class="deep-label" data-deep-label>深度思考</span>
              </div>
              <div class="composer-right">
                <span class="hint">Shift+Enter 换行</span>
                <button class="send-btn" type="button" id="send-btn" aria-label="发送" disabled><i data-lucide="arrow-up"></i></button>
              </div>
            </div>
          </div>
          <p class="disclaimer">内容由 AI 生成，请核实重要信息 · Hello-AgentR</p>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
