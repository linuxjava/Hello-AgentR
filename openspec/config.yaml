schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

context: |
  

rules:
  specs:
    - "所有 API 行为使用 Given/When/Then 格式"
    - "每个 spec 必须包含至少一个错误场景"
    - "每个 requirement 的 scenario 不超过 5 个"
    - "单个 spec 文件不超过 2000 词"
    - "省略理由说明，除非直接影响实现"
    - "使用 RFC 2119 关键词（SHALL/SHOULD/MAY）"
  tasks:
    - "单个 task 不超过 2 小时工作量"
    - "相关 task 按 phase 分组"
    - "每个 phase 结束后包含验证步骤"
    - "新建服务前必须先检查是否有可复用的已有服务"
  design:
    - "包含组件层级图"
    - "文档化所有 API 端点规范"
  proposal:
    - "必须显式列出不做的事项（out-of-scope/NOT doing 清单）"
    - "高风险变更必须包含回滚方案"

languages: |
  Generate all artifacts in Simplified Chinese.
  Use English for code-related terms.